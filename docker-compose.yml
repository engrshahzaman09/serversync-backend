version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: serversync-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: serversync_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: serversync-backend
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/serversync_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data: