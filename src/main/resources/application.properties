spring.application.name=serversync-backend
# Database Config

spring.datasource.url=jdbc:mysql://localhost:3306/serversync_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Server Port
server.port=8085

# JWT Secret
jwt.secret=serversync_secret_key_2024_this_is_a_very_long_secure_key_for_jwt_token
jwt.expiration=86400000
